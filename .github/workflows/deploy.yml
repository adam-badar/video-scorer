name: Build & Deploy to Azure Container Apps

on:
  push:
    branches: [main]

env:
  REGISTRY: bavlioregistry.azurecr.io
  IMAGE: video-scorer
  RESOURCE_GROUP: rg-Bavlio
  CONTAINER_APP: video-scorer

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name bavlioregistry

      - name: Build and push Docker image
        run: |
          TAG="${{ env.REGISTRY }}/${{ env.IMAGE }}:v${{ github.run_number }}"
          docker build --platform linux/amd64 -t "$TAG" .
          docker push "$TAG"

      - name: Deploy to Container Apps
        run: |
          TAG="${{ env.REGISTRY }}/${{ env.IMAGE }}:v${{ github.run_number }}"
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "$TAG"
