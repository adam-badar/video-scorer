name: Build & Deploy to Azure Container Apps

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: bavlioregistry.azurecr.io
  IMAGE: video-scorer
  RESOURCE_GROUP: rg-Bavlio
  CONTAINER_APP: video-scorer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run tests
        run: uv run pytest -q tests/

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name bavlioregistry

      - name: Build and push Docker image
        run: |
          TAG="${{ env.REGISTRY }}/${{ env.IMAGE }}:v${{ github.run_number }}"
          docker build --platform linux/amd64 -t "$TAG" .
          docker push "$TAG"

      - name: Deploy to Container Apps
        run: |
          TAG="${{ env.REGISTRY }}/${{ env.IMAGE }}:v${{ github.run_number }}"
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "$TAG"

      - name: Smoke test
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://video-scorer.greenmoss-36c2fb28.canadacentral.azurecontainerapps.io/health")
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check passed"
