[project]
name = "video-scorer"
version = "0.1.0"
description = "Pre-publish video content optimization scorer"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "httpx>=0.28.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=2.0",
    "pillow>=11.0",
]

[project.scripts]
video-score = "video_scorer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
